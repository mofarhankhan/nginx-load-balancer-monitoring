services:

  app1:
    build: ./app
    container_name: app1
    environment:
      APP_NAME: App-1

  app2:
    build: ./app
    container_name: app2
    environment:
      APP_NAME: App-2

  app3:
    build: ./app
    container_name: app3
    environment:
      APP_NAME: App-3

  nginx:
    image: nginx:latest
    container_name: nginx

    ports:
      - "8080:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - app1
      - app2
      - app3
  
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    depends_on:
      - app1
      - app2
      - app3

